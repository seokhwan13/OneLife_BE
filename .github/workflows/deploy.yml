name: deploy

# =========================
# 전역 환경변수
# =========================
env:
  IMAGE_REPOSITORY: onelife
  CONTAINER_1_NAME: onelife_1
  DOCKER_NETWORK: common

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".env"
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
    branches:
      - develop
      - main

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------
  # 1) 태그/릴리즈 생성
  # ---------------------------------------------------------
  makeTagAndRelease:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create_tag.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Create Tag
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          release_name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          draft: false
          prerelease: false

  # ---------------------------------------------------------
  # 2) Docker 이미지 빌드 & 푸시 (멀티아치)
  # ---------------------------------------------------------
  buildImageAndPush:
    name: Docker Build & Push (amd64 + arm64)
    needs: makeTagAndRelease
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: .env 파일 생성
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          printf "%s" "${DOT_ENV}" > .env

      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ ARM 필수
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:${{ needs.makeTagAndRelease.outputs.tag_name }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:latest

  # ---------------------------------------------------------
  # 3) Raspberry Pi 배포
  # ---------------------------------------------------------
  deploy:
    name: Raspberry Pi Deploy
    runs-on: ubuntu-latest
    needs: [ makeTagAndRelease, buildImageAndPush ]

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.RPI_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }} << 'EOF'
          set -Eeuo pipefail

          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          IMAGE_TAG="${{ needs.makeTagAndRelease.outputs.tag_name }}"
          IMAGE_REPOSITORY="${{ env.IMAGE_REPOSITORY }}"
          IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"

          CONTAINER_NAME="${{ env.CONTAINER_1_NAME }}"
          NET="${{ env.DOCKER_NETWORK }}"

          echo "📦 Pull image (ARM64)"
          docker pull --platform linux/arm64 $IMAGE

          echo "🛑 Stop old container"
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

          echo "🚀 Run new container"
          docker run -d \
            --restart unless-stopped \
            --name $CONTAINER_NAME \
            --network $NET \
            -p 8080:8080 \
            $IMAGE

          echo "🧹 Cleanup old images"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "ghcr.io/${OWNER_LC}/${IMAGE_REPOSITORY}" \
            | grep -v ":${IMAGE_TAG}" \
            | grep -v ":latest" \
            | xargs -r docker rmi || true

          echo "✅ Deploy finished"
          EOF
